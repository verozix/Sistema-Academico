<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Aluno - Sistema Acadêmico</title>
  <link
    rel="stylesheet"
    href="css/style.css">
</head>
<body>

  <!-- Cabeçalho principal -->
  <header class="cabecalho">
    <h1>
      Sistema de Gerenciamento Acadêmico
    </h1>
    <span>
      Área Acadêmica
    </span>
  </header>

  <!-- Navegação principal -->
  <nav>
    <ul>
      <li><a href="index.html">Dashboard</a></li>
      <li><a href="alunos.html">Alunos</a></li>
      <li><a href="cursos.html">Cursos</a></li>
      <li><a href="matriculas.html">Matrículas</a></li>
      <li><a href="usuarios.html">Usuários</a></li>
    </ul>
  </nav>

  <main>
    <section>
      <h2>Cadastro de Aluno</h2>
      <p>Campos marcados com * são obrigatórios.</p>

      <form action="#" method="post">

      <fieldset>
        <legend>Dados do Aluno</legend>

        <label for="nome">Nome *</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Digite o nome completo" required minlength="3" maxlength="60">

        <label for="email">E-mail *</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="nome@exemplo.com" required>

        <label for="nascimento">Data de nascimento *</label>
        <input
          type="date"
          id="nascimento"
          name="nascimento" required>

      </fieldset>

      <fieldset>
        <legend>Dados Acadêmicos</legend>

        <label for="curso">Curso *</label>
        <select id="curso" name="curso" required>
          <option value="">Selecione</option>
          <option value="cco">Ciência da Computação</option>
          <option value="ads">Análise e Desenvolvimento de Sistemas</option>
        </select>

        <fieldset>
          <legend>Situação</legend>
        <input type="radio" id="situacao-ativo" name="situacao" value="ativo" checked>
        <label class="opcao" for="situacao-ativo">Ativo</label>
        <input type="radio" id="situacao-inativo" name="situacao" value="inativo">
        <label class="opcao" for="situacao-inativo">Inativo</label>
        </fieldset>

        <label for="observacao">Observação</label>
        <textarea
          id="observacao"
          name="observacao"></textarea>
      </fieldset>

        <div class="acoes">
          <button type="submit">
            Salvar
          </button>
          <button
            type="reset"
            class="botao-secundario">
            Limpar
          </button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Sistema Acadêmico</p>
  </footer>

</body>
</html>
