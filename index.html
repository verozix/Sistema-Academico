<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Sistema Acadêmico</title>
  <link
    rel="stylesheet"
    href="css/style.css">
</head>
<body>

  <!-- Cabeçalho principal -->
  <header class="cabecalho">
    <h1>
      Sistema de Gerenciamento Acadêmico
    </h1>
    <span>
      Área Acadêmica
    </span>
  </header>

  <!-- Navegação principal -->
  <nav>
    <ul>
      <li><a href="index.html">Dashboard</a></li>
      <li><a href="alunos.html">Alunos</a></li>
      <li><a href="cursos.html">Cursos</a></li>
      <li><a href="matriculas.html">Matrículas</a></li>
      <li><a href="usuarios.html">Usuários</a></li>
    </ul>
  </nav>

  <main>
    <aside class="aviso">
      <h2>Avisos</h2>
      <p>O período de matrícula está aberto até o dia 30/09/2026.</p>
    </aside>

    <section id="dashboard">
      <h2>Dashboard</h2>

      <!-- ATIVIDADE 1 - CSS Grid no Dashboard
           Grid Container: esta div.dashboard-grid
           Grid Items: os 4 articles .card (Alunos, Cursos, Matrículas, Usuários)
           Colunas: 4 (repeat(4, 1fr), definido no css/style.css)
           O card Alunos usa .card-destaque e ocupa 2 colunas (span 2) -->
      <div class="dashboard-grid">
        <article class="card card-destaque">
          <h3>Alunos</h3>
          <p>245</p>
        </article>

        <article class="card">
          <h3>Cursos</h3>
          <p>8</p>
        </article>

        <article class="card">
          <h3>Matrículas</h3>
          <p>310</p>
        </article>

        <article class="card">
          <h3>Usuários</h3>
          <p>12</p>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Sistema Acadêmico</p>
  </footer>

  <!-- JavaScript: a ordem deve ser preservada (dados antes da lógica) -->
  <script src="js/dados.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
