<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Curso - Sistema Acadêmico</title>
  <link
    rel="stylesheet"
    href="css/style.css">
</head>
<body>

  <!-- Cabeçalho principal -->
  <header>
    <h1>Sistema de Gerenciamento Acadêmico</h1>
    <p>Cadastro de novos cursos</p>
  </header>

  <!-- Navegação principal -->
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="alunos.html">Alunos</a>
    <a href="cursos.html">Cursos</a>
    <a href="matriculas.html">Matrículas</a>
    <a href="usuarios.html">Usuários</a>
  </nav>

  <main>
    <section>
      <h2>Cadastro de Curso</h2>
      <p>Campos marcados com * são obrigatórios.</p>

      <form action="#" method="post">

      <fieldset>
        <legend>Dados do Curso</legend>

        <label for="nome">Nome do curso *</label>
        <input
          type="text"
          id="nome"
          name="nome" required minlength="3" maxlength="60">

        <label for="codigo">Código (3 letras maiúsculas) *</label>
        <input
          type="text"
          id="codigo"
          name="codigo"
          placeholder="CCO" required pattern="[A-Z]{3}" maxlength="3" title="Informe três letras maiúsculas. Ex.: CCO">

        <label for="duracao">Duração (semestres) *</label>
        <input
          type="number"
          id="duracao"
          name="duracao" required min="1" max="12">

      </fieldset>

      <fieldset>
        <legend>Descrição</legend>

        <label for="descricao">Descrição do curso</label>
        <textarea
          id="descricao"
          name="descricao"></textarea>
      </fieldset>

        <button type="submit">Salvar</button>
        <button
          type="reset"
          class="botao-secundario">
          Limpar
        </button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Sistema Acadêmico</p>
  </footer>

</body>
</html>
